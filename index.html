<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="gymsynk — coming soon.">
  <title>gymsynk</title>
  <link rel="icon" href="assets/gymsynk-fav.png" type="image/png">
  <style>
    :root {
      --overlay: rgba(0, 0, 0, 0.58);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #0a0a0a;
      color: #fff;
      font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    /* Separate layer so blur does not affect the logo.
       Scaled past the edges so the blur does not flash a halo. */
    .bg {
      position: fixed;
      inset: -32px;
      background: url("assets/gym-bg.jpg") center / cover no-repeat;
      filter: blur(8px);
      transform: scale(1.06);
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--overlay);
    }

    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      text-align: center;
    }

    .logo {
      display: block;
      width: min(28rem, 78vw);
      height: auto;
    }

    .soon {
      margin-top: 1.15rem;
      color: #fff;
      font-size: clamp(0.8rem, 2.1vw, 1rem);
      font-weight: 500;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main>
    <img class="logo" src="assets/gymsynk-logo-01.png" alt="gymsynk">
    <p class="soon">Coming soon</p>
  </main>
</body>
</html>
