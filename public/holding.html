<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GymSynk — gym management software.">
  <title>GymSynk</title>
  <link rel="icon" href="gymsynk-fav-02-wht.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --overlay: rgba(0, 0, 0, 0.58);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #0a0a0a;
      color: #fff;
      font-family: "Montserrat", ui-sans-serif, system-ui, sans-serif;
    }

    /* Separate layer so blur does not affect the logo.
       Scaled past the edges so the blur does not flash a halo. */
    .bg {
      position: fixed;
      inset: -32px;
      background:
        radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 70%);
      transform: scale(1.06);
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--overlay);
    }

    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      text-align: center;
    }

    .logo {
      display: block;
      width: min(28rem, 78vw);
      height: auto;
    }

    .soon {
      margin-top: 1.15rem;
      color: #fff;
      font-size: clamp(0.8rem, 2.1vw, 1rem);
      font-weight: 500;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-transform: uppercase;
    }

    .cta {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .cta a {
      display: inline-block;
      padding: 0.85rem 2rem;
      border-radius: 999px;
      background: #fff;
      color: #0a0a0a;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .cta a:hover {
      opacity: 0.92;
    }

    .cta span {
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.85rem;
    }

    .powered {
      position: fixed;
      bottom: 1rem;
      left: 0;
      right: 0;
      z-index: 1;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.45);
    }

    .powered a {
      color: rgba(255, 255, 255, 0.65);
      text-decoration: none;
      font-weight: 600;
    }

    .powered a:hover {
      color: rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main>
    <img class="logo" src="GymSynk-Logo02-A-Wht.png" alt="GymSynk">
    <p class="soon">Coming soon</p>
    <div class="cta">
      <a href="/login?tenant=reset&amp;redirect=/member/book">Book a session</a>
      <span>Staff or member? <a href="/login?tenant=reset" style="color:#fff;text-transform:none;letter-spacing:0;padding:0;background:none;font-weight:500;">Log in to GymSynk</a></span>
    </div>
  </main>
  <p class="powered">Powered by <a href="https://gymsynk.net">GymSynk</a></p>
</body>
</html>
